# Portal backend routing for xdg-desktop-portal on Hyprland.
# Read because $XDG_CURRENT_DESKTOP=Hyprland (file is <desktop>-portals.conf).
# Overrides the package default in /usr/share/xdg-desktop-portal/.
#
# default = hyprland;gtk
#   hyprland backend serves Screenshot / ScreenCast / GlobalShortcuts;
#   gtk serves everything else it implements (Settings, etc.).
#
# FileChooser is pinned to termfilechooser so both directions of a file
# dialog open yazi in a foot terminal instead of the GTK dialog:
#   open/upload   -> navigate + select existing file(s)
#   save/download -> navigate to a dir, quit; saved with the app's suggested name
# See ~/.config/xdg-desktop-portal-termfilechooser/config for the picker itself.
[preferred]
default = hyprland;gtk
org.freedesktop.impl.portal.FileChooser = termfilechooser
