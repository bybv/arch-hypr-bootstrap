# Monitor — set explicitly per machine if multi-monitor (see host-overrides)
monitor = , preferred, auto, 1

# Session env — Wayland-native where possible
env = XCURSOR_SIZE,28
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,28
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1

# Startup
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprsunset -t 4500
exec-once = swayosd-server
exec-once = udiskie --no-tray

# Input
input {
    kb_layout = us
    kb_options = caps:escape_shifted_capslock
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        disable_while_typing = yes
        clickfinger_behavior = yes
    }
}

gestures {
    workspace_swipe = true
}

# Look — minimal, no animations
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 4
    blur { enabled = false }
    shadow { enabled = false }
}

animations { enabled = false }

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

# Window rules
# zathura (PDF viewer) opens fullscreen — it launches as a tiny floating window
# otherwise. Matched by app-id; dots escaped for the regex.
windowrule = fullscreen, class:^(org\.pwmt\.zathura)$

# Vars
$mod  = SUPER
$term = foot
$menu = fuzzel
$file = thunar

# Apps
bind = $mod, Return,    exec, $term
bind = $mod, D,         exec, $menu
bind = $mod, E,         exec, $file
bind = $mod SHIFT, E,   exec, $term -e yazi
bind = $mod, Q,         killactive,
bind = $mod SHIFT, M,   exit,
bind = $mod, F,         fullscreen,
bind = $mod, V,         togglefloating,
bind = $mod SHIFT, C,   exec, ~/.local/bin/window-fill-height
bind = $mod SHIFT, L,   exec, hyprlock

# Fuzzel menus (scripts in ~/.local/bin)
bind = $mod, B,         exec, ~/.local/bin/bluetooth-menu
bind = $mod, W,         exec, ~/.local/bin/wifi-menu
bind = $mod SHIFT, X,   exec, ~/.local/bin/power-menu

# Waybar toggle (bar starts hidden, Super+/ shows/hides it)
bind = $mod, slash,     exec, killall -SIGUSR1 waybar

# Notifications (mako)
bind = $mod, comma,         exec, makoctl dismiss
bind = $mod SHIFT, comma,   exec, makoctl dismiss --all
bind = $mod, period,        exec, makoctl restore

# Reload — handy during config iteration
bind = $mod SHIFT, R,       exec, hyprctl reload
bind = $mod CTRL, R,        exec, pkill -SIGUSR2 waybar

# Screenshot — fuzzel menu (region/full/window, file or clipboard)
bind = , Print, exec, ~/.local/bin/screenshot-menu

# Clipboard history — watchers run via exec-once for "just in case" capture,
# but the picker bind is commented out since you only use one buffer.
# Uncomment if you ever want history search.
# bind = $mod, C, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# Volume / media — swayosd-client shows OSD overlay on each change
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioPause,       exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# Media via Super (player-agnostic through MPRIS; controls whatever is playing)
bind = $mod, C,            exec, playerctl play-pause
bind = $mod, bracketleft,  exec, playerctl previous
bind = $mod, bracketright, exec, playerctl next

# Volume via Super — redundancy for keyboards without dedicated media keys.
# Number-row cluster (= - 0) chosen to leave Super+PgUp/PgDn free.
bindel = $mod, equal, exec, swayosd-client --output-volume raise
bindel = $mod, minus, exec, swayosd-client --output-volume lower
bindl  = $mod, 0,     exec, swayosd-client --output-volume mute-toggle

# Brightness — also via swayosd
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Focus (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mouse drag
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Night light toggle (hyprsunset)
bind = $mod, N, exec, pkill -USR1 hyprsunset || hyprsunset -t 4500

# -----------------------------------------------------------------------------
# Future binds — paste in when packages are installed and you want to switch
# -----------------------------------------------------------------------------
#
# hyprshot (in the official `extra` repo; uncomment it in base.txt to install).
# Replaces the grim/slurp screenshot binds above; comment those out first to
# avoid duplicate binds:
#   bind = , Print,        exec, hyprshot -m region --clipboard-only
#   bind = SHIFT, Print,   exec, hyprshot -m output --clipboard-only
#   bind = CTRL, Print,    exec, hyprshot -m window --clipboard-only
#
# wlogout (power menu UI):
#   bind = $mod SHIFT, X,  exec, wlogout
#
# Per-monitor setup once you know names from `hyprctl monitors`:
#   monitor = eDP-1,        1920x1200@60,    0x0,    1
#   monitor = DP-1,         3440x1440@100,   1920x0, 1
#   monitor = ,             preferred, auto, 1            # fallback rule
#
# Source per-machine overrides:
#   source = ~/.config/hypr/host.conf

# -----------------------------------------------------------------------------
# Active per-machine override (created empty by bootstrap-base.sh, gitignored).
# Monitor layout, scaling, and host-specific binds go here. Sourced last so it
# overrides anything above.
source = ~/.config/hypr/host.conf
